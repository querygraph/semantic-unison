<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" fill="#172c35">
  <title id="t">How a pair of files gets its status</title>
  <desc id="d">A decision tree. Each shuttle file is matched by relative path, then by name. Unmounted root gives unavailable; no match gives missing; several matches give ambiguous. A match with the same size and SHA-256 is identical. Otherwise DNG and JPEG files compare raw image: same gives metadata-only, different gives image-differs. Any other file, or an image that cannot be read, gives differs.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b5563"/></marker>
  </defs>
  <rect width="1000" height="716" fill="#ffffff"/>
  <g fill="none" stroke="#3b5563" stroke-width="1.8">
    <path d="M360 64 V92" marker-end="url(#a)"/>
    <path d="M360 148 V184" marker-end="url(#a)"/>
    <path d="M360 240 V352" marker-end="url(#a)"/>
    <path d="M520 120 H688" marker-end="url(#a)"/>
    <path d="M520 212 H568" marker-end="url(#a)"/>
    <path d="M808 212 H858" marker-end="url(#a)"/>
    <path d="M740 240 V276" marker-end="url(#a)"/>
    <path d="M620 240 V310 H366" marker-end="url(#a)"/>
    <path d="M520 380 H688" marker-end="url(#a)"/>
    <path d="M360 408 V444" marker-end="url(#a)"/>
    <path d="M520 472 H688" marker-end="url(#a)"/>
    <path d="M360 500 V536" marker-end="url(#a)"/>
    <path d="M200 564 H148 V628" marker-end="url(#a)"/>
    <path d="M520 564 H600 V628" marker-end="url(#a)"/>
  </g>
  <g font-size="15" fill="#3b5563">
    <text x="372" y="172">yes</text><text x="372" y="274">yes</text>
    <text x="536" y="108">no</text><text x="530" y="200">no</text>
    <text x="752" y="264">none</text><text x="810" y="200">several</text>
    <text x="490" y="302">exactly one</text>
    <text x="536" y="368">yes</text><text x="372" y="432">no</text><text x="372" y="524">yes</text>
    <text x="536" y="460">no</text><text x="160" y="552">same</text><text x="534" y="552">differs</text>
  </g>
  <rect x="240" y="20" width="240" height="44" rx="22" fill="#153e51"/>
  <text x="360" y="48" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">File on the shuttle</text>
  <g fill="#eaf1f4" stroke="#7fa6b7" stroke-width="1.5">
    <rect x="200" y="92" width="320" height="56" rx="4"/>
    <rect x="200" y="184" width="320" height="56" rx="4"/>
    <rect x="570" y="184" width="238" height="56" rx="4"/>
    <rect x="200" y="352" width="320" height="56" rx="4"/>
    <rect x="200" y="444" width="320" height="56" rx="4"/>
    <rect x="200" y="536" width="320" height="56" rx="4"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="360" y="126">Is the long-term root mounted?</text>
    <text x="360" y="218">Regular file at the same relative path?</text>
    <text x="689" y="208">Files of that name anywhere</text><text x="689" y="229">on the root (any case)?</text>
    <text x="360" y="386">Same size and same SHA-256?</text>
    <text x="360" y="478">DNG or JPEG with a readable image?</text>
    <text x="360" y="570">Raw image SHA-256</text>
  </g>
  <g stroke-width="1.5">
    <rect x="696" y="96" width="210" height="48" rx="24" fill="#f4f4f4" stroke="#8a97a0"/>
    <rect x="660" y="276" width="160" height="50" rx="25" fill="#f6f0e2" stroke="#c0a15a"/>
    <rect x="860" y="188" width="128" height="48" rx="24" fill="#f6f0e2" stroke="#c0a15a"/>
    <rect x="696" y="356" width="210" height="48" rx="24" fill="#e7f3ec" stroke="#6ea58a"/>
    <rect x="696" y="448" width="210" height="48" rx="24" fill="#f9e9e7" stroke="#c07a70"/>
    <rect x="40" y="628" width="216" height="72" rx="24" fill="#e7f3ec" stroke="#6ea58a"/>
    <rect x="490" y="628" width="220" height="72" rx="24" fill="#f9e9e7" stroke="#c07a70"/>
  </g>
  <g font-size="17" font-weight="700" text-anchor="middle">
    <text x="801" y="126">unavailable</text>
    <text x="740" y="307">missing</text>
    <text x="924" y="218">ambiguous</text>
    <text x="801" y="386">identical</text>
    <text x="801" y="478">differs</text>
    <text x="148" y="658">metadata-only</text>
    <text x="600" y="658">image-differs</text>
  </g>
  <g font-size="14" text-anchor="middle" fill="#3b5563">
    <text x="148" y="680">-sameview adds: same view?</text>
    <text x="600" y="680">the preview set is reported too</text>
  </g>
</svg>
