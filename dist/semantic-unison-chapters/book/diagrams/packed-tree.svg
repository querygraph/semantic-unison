<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" fill="#172c35">
  <title id="t">A packed tree and the plain view of it</title>
  <desc id="d">On the disk, a directory D is one SQLite file D.sqlar, possibly beside a plain directory D holding kept originals. Three hooks, stat, children and fingerprint, present the container to Unison as the directory D, with members as files. A member wins over a plain file of the same name.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b5563"/></marker></defs>
  <rect width="1000" height="540" fill="#ffffff"/>
  <rect x="20" y="20" width="370" height="420" rx="4" fill="#f6f0e2" stroke="#c0a15a" stroke-width="1.5"/>
  <rect x="630" y="20" width="350" height="420" rx="4" fill="#eaf1f4" stroke="#7fa6b7" stroke-width="1.5"/>
  <text x="36" y="52" font-size="18" font-weight="700" fill="#153e51">On the disk (packed root)</text>
  <text x="646" y="52" font-size="18" font-weight="700" fill="#153e51">What Unison sees</text>
  <g font-family="Menlo, Consolas, monospace" font-size="15.5">
    <text x="36" y="90">.unison-packed</text>
    <text x="36" y="118">LEAFSET.json</text>
    <text x="36" y="146">0/</text>
    <text x="60" y="174" font-weight="700" fill="#075b82">0000.sqlar</text>
    <text x="60" y="202">0000/</text>
    <text x="84" y="230">old.lrfprev</text>
    <text x="84" y="258">b_320</text>
    <text x="60" y="286" font-weight="700" fill="#075b82">0001.sqlar</text>
    <text x="36" y="314">a/</text>
    <text x="60" y="342" font-weight="700" fill="#075b82">0a00.sqlar</text>
    <text x="36" y="384" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b5563">Bold: one SQLite file per directory.</text>
    <text x="36" y="408" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b5563">0000/ holds kept originals, never written.</text>
    <text x="646" y="90" fill="#8a97a0">(marker hidden)</text>
    <text x="646" y="118">LEAFSET.json</text>
    <text x="646" y="146">0/</text>
    <text x="670" y="174">0000/</text>
    <text x="694" y="202" fill="#075b82">a_320</text>
    <text x="694" y="230" fill="#075b82">a_1024</text>
    <text x="694" y="258" fill="#075b82">b_320</text>
    <text x="780" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3b5563">member wins</text>
    <text x="694" y="286">old.lrfprev</text>
    <text x="670" y="314">0001/ ...</text>
    <text x="646" y="342">a/</text>
    <text x="670" y="370">0a00/ ...</text>
    <text x="646" y="408" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#3b5563">Blue: members, with stored size, mtime, MD5.</text>
  </g>
  <g fill="none" stroke="#3b5563" stroke-width="1.8">
    <path d="M398 230 H622" marker-end="url(#a)"/>
  </g>
  <rect x="418" y="110" width="192" height="96" rx="4" fill="#efeaf4" stroke="#9483ad" stroke-width="1.5"/>
  <text x="514" y="136" font-size="16" font-weight="700" text-anchor="middle">PackdirHook</text>
  <g font-size="15" text-anchor="middle">
    <text x="514" y="160">stat, children,</text><text x="514" y="182">fingerprint</text>
    <text x="514" y="258" fill="#3b5563">packed root only;</text><text x="514" y="280" fill="#3b5563">every other path uses</text><text x="514" y="302" fill="#3b5563">the real filesystem</text>
    <text x="514" y="346" fill="#3b5563">unchanged container:</text><text x="514" y="368" fill="#3b5563">one stat, not opened</text>
  </g>
  <rect x="20" y="456" width="960" height="64" rx="4" fill="#ffffff" stroke="#7fa6b7"/>
  <text x="500" y="483" font-size="17" text-anchor="middle" font-weight="700">The preview cache: 3,616,982 files, 4.43 TiB, becomes 65,536 containers on the disk</text>
  <text x="500" y="507" font-size="15" text-anchor="middle" fill="#3b5563">about 55 files and 71 MiB per directory; reports, ignore and fingerprints still work per member path</text>
</svg>
