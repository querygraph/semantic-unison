<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" fill="#172c35">
  <title id="t">The shuttle-disk flow</title>
  <desc id="d">Four steps from left to right: compare, keep, catch up, compare again. The result is safe to wipe, exit 0, or a list of reasons, exit 1. The shuttle is only read. The long-term root gains only new files. Everything else is kept beside the root.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b5563"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <g fill="#eaf1f4" stroke="#7fa6b7" stroke-width="1.5">
    <rect x="20" y="30" width="216" height="150" rx="4"/>
    <rect x="266" y="30" width="216" height="150" rx="4"/>
    <rect x="512" y="30" width="216" height="150" rx="4"/>
    <rect x="758" y="30" width="222" height="150" rx="4"/>
  </g>
  <g fill="none" stroke="#3b5563" stroke-width="1.8">
    <path d="M236 105 H264" marker-end="url(#a)"/><path d="M482 105 H510" marker-end="url(#a)"/><path d="M728 105 H756" marker-end="url(#a)"/>
    <path d="M869 180 V226" marker-end="url(#a)"/>
    <path d="M128 262 V180" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M128 262 H640"/>
  </g>
  <g font-size="19" font-weight="700" fill="#153e51">
    <text x="36" y="62">1. Compare</text><text x="282" y="62">2. Keep</text><text x="528" y="62">3. Catch up</text><text x="774" y="62">4. Compare again</text>
  </g>
  <g font-size="15.5">
    <text x="36" y="92">Walk the shuttle. Match</text><text x="36" y="114">by path, else by name.</text><text x="36" y="136">Hash, then compare</text><text x="36" y="158">image and metadata.</text>
    <text x="282" y="92">With -preserve: archive</text><text x="282" y="114">rows, verified deltas,</text><text x="282" y="136">and conflict copies.</text><text x="282" y="158">Never inside the root.</text>
    <text x="528" y="92">Unison copies missing</text><text x="528" y="114">files only: creation on</text><text x="528" y="136">the root, no update, no</text><text x="528" y="158">deletion, no archive.</text>
    <text x="774" y="92">Only if anything was</text><text x="774" y="114">copied. Earlier results</text><text x="774" y="136">are reused. The last</text><text x="774" y="158">summary is the final one.</text>
  </g>
  <rect x="750" y="228" width="230" height="74" rx="4" fill="#e7f3ec" stroke="#6ea58a" stroke-width="1.5"/>
  <text x="865" y="258" font-size="17" font-weight="700" text-anchor="middle">safe to wipe</text>
  <text x="865" y="282" font-size="15" text-anchor="middle">all kept and unchanged, exit 0</text>
  <rect x="750" y="316" width="230" height="74" rx="4" fill="#f9e9e7" stroke="#c07a70" stroke-width="1.5"/>
  <text x="865" y="346" font-size="17" font-weight="700" text-anchor="middle">not safe</text>
  <text x="865" y="370" font-size="15" text-anchor="middle">reasons by folder, exit 1</text>
  <text x="140" y="250" font-size="15" fill="#3b5563">a rerun reuses results; a pair is read again only if a file changed</text>
  <g font-size="16">
    <rect x="20" y="316" width="700" height="134" rx="4" fill="#f6f0e2" stroke="#c0a15a"/>
    <text x="36" y="344" font-weight="700">What gets written, and where</text>
    <text x="36" y="372">Shuttle: nothing, ever.</text>
    <text x="36" y="398">Long-term root: only files that were missing there. No file is updated or deleted.</text>
    <text x="36" y="424">Beside the root: dng-compare/SHUTTLE (archive), review/ROOTNAME/ (conflict copies).</text>
  </g>
</svg>
